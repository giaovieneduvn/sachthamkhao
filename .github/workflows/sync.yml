name: Sync products from Accesstrade

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync
        run: |
          curl -sf -X POST "${{ secrets.SYNC_URL }}/api/cron/sync?pages=5" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
